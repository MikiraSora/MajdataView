              a:focus-visible {{
                outline: 3px solid #7dd3fc;
                outline-offset: 3px;
              }}
              .eyebrow {{
                display: inline-flex;
                padding: 6px 10px;
                border: 1px solid rgba(125, 211, 252, 0.28);
                border-radius: 999px;
                background: rgba(14, 165, 233, 0.1);
                color: #7dd3fc;
                font-size: 0.78rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
              }}
              .intro {{
                max-width: 680px;
                font-size: 1.08rem;
              }}
              .download-panel {{
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 28px;
                align-items: center;
                margin-top: 36px;
                padding: 28px;
                border: 1px solid rgba(148, 163, 184, 0.2);
                border-radius: 20px;
                background: rgba(15, 29, 48, 0.86);
                box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
                backdrop-filter: blur(12px);
              }}
              .download-panel h2 {{
                margin: 0 0 8px;
                font-size: 1.45rem;
              }}
              .button {{
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 48px;
                padding: 0 20px;
