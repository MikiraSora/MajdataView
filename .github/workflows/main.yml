name: Build MajdataEditView
run-name: Build MajdataEditView (${{ github.ref_name }})

"on":
  push:
  repository_dispatch:
    types:
      - majdataedit-push
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: majdataeditview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unity:
    name: Build MajdataView Windows x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MajdataView
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      - name: Build MajdataView Windows x64 player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: StandaloneWindows64
          versioning: Semantic
          buildName: MajdataView
          buildsPath: build

      - name: Upload MajdataView build
        uses: actions/upload-artifact@v4
        with:
          name: MajdataView-StandaloneWindows64
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14

  build-editor:
    name: Build MajdataEdit Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout MajdataEdit
        uses: actions/checkout@v4
        with:
          repository: MikiraSora/MajdataEdit
          ref: ${{ github.event.client_payload.majdataedit_sha || 'master' }}
          fetch-depth: 0
          submodules: recursive
          path: MajdataEdit

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Initialize MajdataEdit submodules
        run: git submodule update --init --recursive
        working-directory: MajdataEdit

      - name: List MajdataEdit projects
        shell: pwsh
        run: Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -ExpandProperty FullName
        working-directory: MajdataEdit

      - name: Restore MajdataEdit
        run: dotnet restore MajdataEdit.csproj -p:EnableWindowsTargeting=true
        working-directory: MajdataEdit

      - name: Publish MajdataEdit
        run: dotnet publish MajdataEdit.csproj -c Release -f net6.0-windows -r win-x64 --no-self-contained -p:EnableWindowsTargeting=true
        working-directory: MajdataEdit

      - name: Upload MajdataEdit build
        uses: actions/upload-artifact@v4
        with:
          name: MajdataEdit-win-x64
          path: MajdataEdit/bin/Release/net6.0-windows/win-x64/publish
          if-no-files-found: error
          retention-days: 14

  package-pages:
    name: Package and Deploy Downloads
    if: github.event_name == 'repository_dispatch' || github.ref_name == github.event.repository.default_branch
    needs:
      - build-unity
      - build-editor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MajdataView assets
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download MajdataView build into package root
        uses: actions/download-artifact@v4
        with:
          name: MajdataView-StandaloneWindows64
          path: package

      - name: Download MajdataEdit build into package root
        uses: actions/download-artifact@v4
        with:
          name: MajdataEdit-win-x64
          path: package

      - name: Extract SFX and Skin assets into package root
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil

          source = Path("SFXSKIN.zip")
          package_dir = Path("package")
          required_roots = {"SFX", "Skin"}

          if not source.is_file():
              raise FileNotFoundError(f"Missing required asset archive: {source}")

          with ZipFile(source) as archive:
              available_roots = {
                  entry.filename.replace("\\", "/").split("/", 1)[0]
                  for entry in archive.infolist()
                  if entry.filename
              }
              missing_roots = required_roots - available_roots
              if missing_roots:
                  missing = ", ".join(sorted(missing_roots))
                  raise RuntimeError(f"{source} is missing required folders: {missing}")

              for entry in archive.infolist():
                  entry_name = entry.filename.replace("\\", "/")
                  entry_path = PurePosixPath(entry_name)

                  if entry.is_dir() or not entry_path.parts:
                      continue
                  if entry_path.is_absolute() or ".." in entry_path.parts:
                      raise RuntimeError(f"Unsafe path in {source}: {entry.filename}")
                  if entry_path.parts[0] not in required_roots:
                      continue

                  target = package_dir.joinpath(*entry_path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(entry) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)
          PY

      - name: Build download page
        shell: bash
        run: |
          python3 <<'PY'
          from datetime import datetime, timedelta, timezone
          from html import escape
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          import os

          root = Path.cwd()
          package_dir = root / "package"
          site_dir = root / "site"
          downloads_dir = site_dir / "downloads"
          downloads_dir.mkdir(parents=True, exist_ok=True)

          beijing_timezone = timezone(timedelta(hours=8))
          build_datetime = datetime.now(beijing_timezone)
          build_time = build_datetime.strftime("%Y-%m-%d %H:%M:%S")
          ga_build_time = build_datetime.strftime("%Y%m%d%H%M%S")
          commit_sha = os.environ["GITHUB_SHA"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          safe_ref_name = "".join(
              character if character.isascii() and (character.isalnum() or character in ".-_") else "-"
              for character in ref_name
          ).strip(".-_") or "unknown"
          build_configuration = "Release"
          zip_name = (
              f"MajdataEditView_{safe_ref_name}_"
              f"(GABuild{ga_build_time}_{commit_sha[:6]}_{build_configuration}).zip"
          )
          zip_path = downloads_dir / zip_name

          with ZipFile(zip_path, "w", ZIP_DEFLATED) as archive:
              for file_path in sorted(package_dir.rglob("*")):
                  if file_path.is_file():
                      archive.write(file_path, file_path.relative_to(package_dir))

          repo = os.environ["GITHUB_REPOSITORY"]
          repo_url = f"https://github.com/{repo}"
          commit_url = f"{repo_url}/commit/{commit_sha}"

          (site_dir / "index.html").write_text(f"""<!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="description" content="MajdataView 与 MajdataEdit Windows x64 自动构建下载及谱面资源。">
            <title>MajdataEditView 下载</title>
            <style>
              :root {{
                color-scheme: dark;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #07111f;
                color: #f8fafc;
              }}
              * {{ box-sizing: border-box; }}
              body {{
                margin: 0;
                min-height: 100vh;
                background:
                  radial-gradient(circle at 15% 0%, rgba(14, 165, 233, 0.2), transparent 32rem),
