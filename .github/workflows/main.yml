                    </div>
                  </dl>
                </div>
                <a class="button" href="downloads/{escape(zip_name)}" download>下载 ZIP</a>
              </section>

              <section class="resources" aria-labelledby="resources-title">
                <div class="section-heading">
                  <h2 id="resources-title">谱面与变速资源</h2>
